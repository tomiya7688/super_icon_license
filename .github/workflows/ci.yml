name: Asset and tool checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade system CA trust store
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          dpkg-query -W -f='ca-certificates ${Version}\n' ca-certificates

      - name: Upgrade Python packaging trust baseline
        run: |
          python3 -m pip install --upgrade "pip>=26.2.2"
          python3 -m pip install --upgrade -r requirements-tools.txt

      - name: Record and verify Python TLS trust stores
        run: |
          python3 --version
          python3 -m pip --version
          python3 -c "import certifi; print(certifi.__version__); print(certifi.where())"
          python3 tools/check_python_trust.py

      - name: Check Python tool syntax
        run: python3 -m py_compile tools/reduce_palette.py tools/check_python_trust.py tools/generate_asset_manifest.py

      - name: Validate PNG file signatures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          signature = bytes.fromhex("89504e470d0a1a0a")
          files = list(Path("Assets").rglob("*.png"))
          for path in files:
              with path.open("rb") as stream:
                  if stream.read(8) != signature:
                      raise SystemExit(f"Invalid PNG header: {path}")
          print(f"Checked {len(files)} PNG assets")
          PY

      - name: Validate official asset provenance catalog
        run: |
          python3 tools/generate_asset_manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --output /tmp/assets-manifest.json \
            --checksums /tmp/SHA256SUMS
